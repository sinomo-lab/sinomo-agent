[workspace]
resolver = "3"

# Retired packages may leave empty directories in existing checkouts.
exclude = [
    "crates/sinomo-app-contract",
    "crates/sinomo-dfs-api",
    "crates/sinomo-lm-contract",
    "crates/sinomo-module-client",
    "crates/sinomo-observe-contract",
]

members = [
    "crates/*",
    "modules/*/*",
]

default-members = [
    "crates/sinomo",
    "crates/sinomo-actions",
    "crates/sinomo-agent",
    "crates/sinomo-api",
    "crates/sinomo-app",
    "crates/sinomo-app-daemon",
    "crates/sinomo-audio",
    "crates/sinomo-base",
    "crates/sinomo-build",
    "crates/sinomo-build-client",
    "crates/sinomo-cluster",
    "crates/sinomo-cli",
    "crates/sinomo-cli-registry",
    "crates/sinomo-client",
    "crates/sinomo-config",
    "crates/sinomo-core",
    "crates/sinomo-daemon",
    "crates/sinomo-deliberation",
    "crates/sinomo-device",
    "crates/sinomo-dfs",
    "crates/sinomo-dfs-nfs",
    "crates/sinomo-eval",
    "crates/sinomo-events",
    "crates/sinomo-fusion",
    "crates/sinomo-gateway",
    "crates/sinomo-installer",
    "crates/sinomo-kv",
    "crates/sinomo-lm",
    "crates/sinomo-local",
    "crates/sinomo-memory",
    "crates/sinomo-models",
    "crates/sinomo-module",
    "crates/sinomo-module-api",
    "crates/sinomo-network",
    "crates/sinomo-node",
    "crates/sinomo-object",
    "crates/sinomo-observe",
    "crates/sinomo-policy",
    "crates/sinomo-product-profile",
    "crates/sinomo-pytorch",
    "crates/sinomo-registry",
    "crates/sinomo-remote-management",
    "crates/sinomo-rollout",
    "crates/sinomo-rollout-client",
    "crates/sinomo-rollout-host",
    "crates/sinomo-runtime",
    "crates/sinomo-sandbox",
    "crates/sinomo-sandbox-simple",
    "crates/sinomo-service",
    "crates/sinomo-storage",
    "crates/sinomo-supervision",
    "crates/sinomo-test",
    "crates/sinomo-testdir",
    "crates/sinomo-ui-extension-host",
    "crates/sinomo-vfs",
    "crates/sinomo-vfs-sifs",
    "crates/sinomo-video",
    "crates/sinomo-voice",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
version = "0.1.0"

[profile.release]
panic = "abort"

[profile.dev]
debug = "limited"
incremental = true

[profile.dev.package."*"]
debug = "limited"

# The network data plane remains on the ordinary incremental dev pipeline, but
# bodyless routed RPCs otherwise spend most of their budget in unoptimized mux,
# framing, and authenticated-stream code before device/network latency is even
# visible. Optimize only that hot crate so Docker debug-cluster measurements
# exercise the production-shaped data path without making the full workspace
# expensive to rebuild while iterating.
[profile.dev.package.sinomo-network]
opt-level = 2

# DFS metadata authority is part of the same latency-sensitive distributed
# data plane. Keep the rest of the workspace cheap to build while avoiding
# debug-only multi-millisecond table/query overhead in cluster benchmarks.
[profile.dev.package.sinomo-dfs]
opt-level = 2

# The daemon owns the service adapter around that data plane; leaving only the
# adapter unoptimized makes a warmed metadata lookup slower than the network
# and DFS work it encloses.
[profile.dev.package.sinomo-daemon]
opt-level = 2

[profile.android-debug-small]
inherits = "dev"
debug = 0
strip = "debuginfo"

[patch.crates-io]
virtual-fs = { path = "modules/sandbox/wasix/vendor/virtual-fs" }
wasmer-compiler = { path = "modules/sandbox/wasix/vendor/wasmer-compiler" }
wasmer-vm = { path = "modules/sandbox/wasix/vendor/wasmer-vm" }
wasmer-wasix = { path = "modules/sandbox/wasix/vendor/wasmer-wasix" }

[workspace.dependencies]
sinomo-cli-registry = { path = "crates/sinomo-cli-registry" }
sinomo-api = { path = "crates/sinomo-api" }
sinomo-module-api = { path = "crates/sinomo-module-api" }
sinomo-core = { path = "crates/sinomo-core", default-features = false }
sinomo-config = { path = "crates/sinomo-config" }
sinomo-testdir = { path = "crates/sinomo-testdir" }
dunce = "1.0.5"
toml_edit = "0.25.13"
arc-swap = "1.9.2"
base64 = "0.22.1"
blake3 = "1.8.5"
bytes = { version = "1.12.1", features = ["serde"] }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
cpal = "0.18.1"
image = { version = "0.25.10", default-features = false }
jni = "0.22.4"
libc = "0.2.186"
nokhwa = { version = "0.10.11", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_yaml = "0.9.34"
fs2 = "0.4.3"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
getrandom = "0.4.3"
local-ip-address = "0.6.13"
pulldown-cmark = { version = "0.13.4", default-features = false }
rfd = "0.17.2"
serde_json = "1.0.150"
signal-hook = { version = "0.3.18", default-features = false }
sui-lucide = { package = "sinomo-ui-lucide", git = "https://github.com/sinomo-lab/sui.git", branch = "main" }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
tar = "0.4.46"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde", "serde-well-known"] }
toml = "1.1.3"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry", "std"] }
metrics = "0.24.6"
nfs3_server = "0.11.0"
nfs3_client = "0.9.0"
pprof = { version = "0.15.0", default-features = false, features = ["framehop-unwinder", "prost-codec"] }
netwatcher = { version = "0.7.1", features = ["tokio"] }
notify = "8.2.0"
ulid = "3.0.0"
v4l = "0.14.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
windows-collections = "0.3.2"
windows = "0.62.2"

# Joint SUI fixes under review; use the sibling checkout until published upstream.
[patch."https://github.com/sinomo-lab/sui.git"]
sinomo-ui = { path = "../sui/crates/sui" }
sinomo-ui-lucide = { path = "../sui/crates/sui-lucide" }
sinomo-ui-testing = { path = "../sui/crates/sui-testing" }
