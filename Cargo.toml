[workspace]
resolver = "3"

members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
version = "0.1.0"

[profile.release]
opt-level = 2
panic = "abort"

[profile.dev]
opt-level = 2
incremental = false

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
fs2 = "0.4"
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tracing = "0.1"
ulid = "1.2"
