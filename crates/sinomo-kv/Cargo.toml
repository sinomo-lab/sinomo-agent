[package]
name = "sinomo-kv"
version.workspace = true
description = "Sinomo in-process cluster KV control-plane core"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
base64 = "0.22"
serde.workspace = true
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
thiserror.workspace = true
time.workspace = true
fs2.workspace = true
tokio = { version = "1.44", features = ["rt"] }
sinomo-core = { path = "../sinomo-core" }
sinomo-storage = { path = "../sinomo-storage" }
