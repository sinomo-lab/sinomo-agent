[package]
name = "sinomo-kv"
version.workspace = true
description = "Sinomo in-process cluster KV control-plane core"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r0"

[features]
default = []
test-support = []

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
thiserror.workspace = true
time.workspace = true
fs2.workspace = true
metrics.workspace = true
tokio.workspace = true
sinomo-base = { path = "../sinomo-base" }
sinomo-node = { path = "../sinomo-node" }
sinomo-storage = { path = "../sinomo-storage" }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
