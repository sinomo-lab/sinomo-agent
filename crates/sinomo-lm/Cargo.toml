[package]
name = "sinomo-lm"
version.workspace = true
description = "Sinomo language model provider interfaces and integrations"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
sinomo-runtime = { path = "../sinomo-runtime" }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
