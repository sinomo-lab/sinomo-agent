[package]
name = "sinomo-lm"
version.workspace = true
description = "Sinomo language model provider interfaces and integrations"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[dependencies]
base64.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
image = { workspace = true, features = ["jpeg", "png"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "query", "rustls", "stream"] }
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }
tokio-websockets = { version = "0.13.2", default-features = false, features = ["client", "getrandom", "ring", "rustls-native-roots"] }
sinomo-runtime = { path = "../sinomo-runtime" }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
