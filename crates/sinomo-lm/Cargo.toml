[package]
name = "sinomo-lm"
version.workspace = true
description = "Sinomo language model provider interfaces and integrations"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "src/codex/models.json", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[features]
default = []
cli = ["sinomo-runtime/cli-client"]
test-cases = ["sinomo-runtime/host"]
# Deterministic provider that replays scripted model exchanges, for tests that
# must run the agent stack without a real model. Never enabled in release builds.
scripted-provider = []
# Carries realtime audio over a WebRTC peer connection for providers that negotiate one.
# Off by default: it pulls in a full WebRTC stack and a C Opus codec that most builds never use.
webrtc-media = ["dep:webrtc", "dep:rtc", "dep:audiopus", "dep:async-trait"]

[dependencies]
tracing.workspace = true
async-trait = { version = "0.1", optional = true }
audiopus = { version = "0.2.0", features = ["coder"], optional = true }
base64.workspace = true
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
http = "1.4.2"
image = { workspace = true, features = ["jpeg", "png"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "multipart", "query", "rustls", "stream"] }
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
rtc = { version = "0.20.2", optional = true }
webrtc = { version = "0.20.2", optional = true }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "getrandom", "ring", "rustls-native-roots"] }
sinomo-runtime = { path = "../sinomo-runtime", default-features = false, features = ["client"] }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
