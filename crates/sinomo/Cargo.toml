[package]
name = "sinomo"
version.workspace = true
description = "Sinomo"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
include = ["**/*.rs", "build.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "application"
[features]
default = ["sandbox", "dfs-fuse"]
# Enable sandbox execution through the native-module host loader. The heavy
# WASIX engine is built and activated as a separate native-dylib module.
sandbox = ["sinomo-cli/sandbox"]
dfs-fuse = ["sinomo-cli/dfs-fuse"]
native-devices = ["sinomo-cli/native-devices"]
desktop-e2e = ["sinomo-cli/desktop-e2e"]
# Selectable `scripted` model provider for end-to-end tests. Never in releases.
scripted-provider = ["sinomo-cli/scripted-provider"]
# Build the in-process model runtimes. Off by default: they pull in Candle and a
# tokenizer, which most builds do not need.
native-models = ["sinomo-cli/native-models"]

[dependencies]
sinomo-cli = { path = "../sinomo-cli", default-features = false }
sinomo-runtime = { path = "../sinomo-runtime" }

[dev-dependencies]
tokio.workspace = true
blake3.workspace = true
serde_json.workspace = true
sinomo-dfs-fuse = { path = "../sinomo-dfs-fuse" }
sinomo-client = { path = "../sinomo-client" }
sinomo-lm = { path = "../sinomo-lm" }
sinomo-testdir = { path = "../sinomo-testdir" }

[[test]]
name = "scripted_chat"
required-features = ["scripted-provider"]
