[package]
name = "sinomo"
version.workspace = true
description = "Sinomo"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "application"
[features]
# Enable the build-heavy wasm sandbox runtime. OFF by default so `cargo build -p
# sinomo` skips wasmtime/wasmer; build with `--features sandbox` for the full runtime.
sandbox = ["sinomo-cli/sandbox"]

[dependencies]
sinomo-cli = { path = "../sinomo-cli" }
