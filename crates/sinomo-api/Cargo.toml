[package]
name = "sinomo-api"
version.workspace = true
description = "Lightweight Sinomo daemon wire API contracts"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "build.rs"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
blake3.workspace = true
sinomo-module-api.workspace = true
fs2.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_bytes.workspace = true
serde_json.workspace = true
sinomo-core = { path = "../sinomo-core" }
sinomo-config = { path = "../sinomo-config" }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true

[dev-dependencies]
sinomo-core = { path = "../sinomo-core", features = ["network-test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
tokio = { workspace = true, features = ["test-util"] }
