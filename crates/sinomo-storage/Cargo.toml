[package]
name = "sinomo-storage"
version.workspace = true
description = "Sinomo storage layout and object schema contracts"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r0"

[dependencies]
blake3.workspace = true
fs2.workspace = true
serde.workspace = true
thiserror.workspace = true
sinomo-object = { path = "../sinomo-object", features = ["serde"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
