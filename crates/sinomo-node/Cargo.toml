[package]
name = "sinomo-node"
version.workspace = true
description = "Sinomo node identity, profile, health, and capability metadata"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r0"

[dependencies]
base64.workspace = true
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sinomo-base = { path = "../sinomo-base" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-storage = { path = "../sinomo-storage" }
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
serde_json.workspace = true
sinomo-testdir = { path = "../sinomo-testdir" }
