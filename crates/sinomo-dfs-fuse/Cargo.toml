[package]
name = "sinomo-dfs-fuse"
version.workspace = true
description = "Optional FUSE mount adapter for Sinomo DFS/SIFS"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "application"

[features]
default = ["fuse"]
fuse = ["dep:crossbeam-channel", "dep:fuser", "dep:libc"]

[dependencies]
sinomo-runtime = { path = "../sinomo-runtime" }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
crossbeam-channel = { workspace = true, optional = true }
fuser = { version = "0.17.0", optional = true, default-features = false, features = ["abi-7-31"] }
libc = { version = "0.2.186", optional = true }

[dev-dependencies]
# The handoff tests drive the real outbox against the DFS crate's test daemon.
sinomo-runtime = { path = "../sinomo-runtime", features = ["dfs-test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
