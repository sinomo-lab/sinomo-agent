[package]
name = "sinomo-dfs-attachments"
version.workspace = true
description = "Optional Sinomo file attachment component"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
blake3.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
sinomo-api.workspace = true
sinomo-core.workspace = true
sinomo-config.workspace = true
sinomo-cli-registry.workspace = true
sinomo-dfs.workspace = true
sinomo-module.workspace = true
sinomo-module-api.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
sinomo-dfs = { workspace = true, features = ["test-support"] }
sinomo-core = { workspace = true, features = ["cluster-test-support", "network-test-support"] }
sinomo-testdir.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
