[package]
name = "sinomo-dfs"
version.workspace = true
description = "Sinomo local-first distributed filesystem metadata skeleton"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
sinomo-core = { path = "../sinomo-core" }
sinomo-kv = { path = "../sinomo-kv" }
sinomo-network = { path = "../sinomo-network" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }

[dev-dependencies]
