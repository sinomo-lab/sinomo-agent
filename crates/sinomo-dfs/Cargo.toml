[package]
name = "sinomo-dfs"
version.workspace = true
description = "Sinomo local-first distributed filesystem"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md"]

[package.metadata.sinomo]
ring = "r1"

[features]
default = []
test-support = []
migration-bench = []

[dependencies]
base64.workspace = true
sinomo-cli-registry.workspace = true
sinomo-api.workspace = true
blake3.workspace = true
bytes.workspace = true
fs2.workspace = true
metrics.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
sinomo-core = { path = "../sinomo-core" }
sinomo-config = { path = "../sinomo-config" }
sinomo-device = { path = "../sinomo-device" }
sinomo-module = { path = "../sinomo-module" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Networking_Connectivity",
    "Win32_System_WinRT",
] }
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
sinomo-dfs-history.workspace = true
sinomo-core = { path = "../sinomo-core", features = ["cluster-test-support", "network-test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "storage_migration"
harness = false
required-features = ["migration-bench"]
