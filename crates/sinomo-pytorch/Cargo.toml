[package]
name = "sinomo-pytorch"
version.workspace = true
description = "PyTorch/Transformers model bridge for Sinomo's local model runtimes"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "python/*.py"]

[package.metadata.sinomo]
ring = "r2"

[dependencies]
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
sinomo-runtime = { path = "../sinomo-runtime" }
thiserror.workspace = true
sinomo-lm = { path = "../sinomo-lm" }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
