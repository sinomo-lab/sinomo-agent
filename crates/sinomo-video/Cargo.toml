[package]
name = "sinomo-video"
version.workspace = true
description = "Sinomo video and screen perception event producer skeleton"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "**/*.c", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[features]
default = []
# Requires system FFmpeg development libraries; never selects a software encoder.
desktop-gpu = ["dep:cc", "dep:pkg-config"]
native-devices = ["sinomo-runtime/native-devices"]

[dependencies]
tracing.workspace = true
openh264.workspace = true
h264-reader.workspace = true
sinomo-lm.workspace = true
tokio.workspace = true
image = { workspace = true, features = ["jpeg"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sinomo-gateway = { path = "../sinomo-gateway" }
sinomo-runtime = { path = "../sinomo-runtime", default-features = false, features = ["device-client"] }
thiserror.workspace = true

[build-dependencies]
cc = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
jni.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[[example]]
name = "android_decoder_probe"
crate-type = ["cdylib"]
