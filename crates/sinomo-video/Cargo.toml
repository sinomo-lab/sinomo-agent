[package]
name = "sinomo-video"
version.workspace = true
description = "Sinomo video and screen perception event producer skeleton"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[features]
default = []
native-devices = ["sinomo-runtime/native-devices"]

[dependencies]
tracing.workspace = true
openh264.workspace = true
h264-reader.workspace = true
sinomo-lm.workspace = true
tokio.workspace = true
image = { workspace = true, features = ["jpeg"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sinomo-gateway = { path = "../sinomo-gateway" }
sinomo-runtime = { path = "../sinomo-runtime", default-features = false, features = ["device-client"] }
thiserror.workspace = true
