[package]
name = "sinomo-build-client"
version.workspace = true
description = "Typed client for the Sinomo build component"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
include = ["src/**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
serde.workspace = true
sinomo-build = { path = "../sinomo-build" }
sinomo-core = { path = "../sinomo-core" }
sinomo-daemon = { path = "../sinomo-daemon", default-features = false }
tokio.workspace = true
