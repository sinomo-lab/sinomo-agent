[package]
name = "sinomo-cli"
version.workspace = true
description = "Sinomo command-line interface, TUI, and daemon-hosted product services"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "application"

[features]
default = ["sandbox", "dfs-fuse"]
dfs-fuse = ["dep:sinomo-dfs-fuse", "sinomo-dfs-fuse/fuse"]
native-models = ["dep:candle-core", "dep:sinomo-models", "dep:tokenizers"]
desktop-e2e = ["dep:windows", "sinomo-runtime/network-test-support"]
# Opt-in adaptation of an existing native owner for downstream test fixtures.
dfs-test-support = ["sinomo-runtime/dfs-test-support"]
# Selectable `scripted` model provider for end-to-end tests. Never in releases.
scripted-provider = ["sinomo-lm/scripted-provider"]
native-devices = [
    "sinomo-audio/native-devices",
    "sinomo-runtime/native-devices",
    "sinomo-video/native-devices",
]
# Enable sandbox execution through the native-module host loader. This does not
# link the build-heavy WASIX module; it loads an active dylib from the data dir.
sandbox = ["sinomo-runtime/sandbox"]

[dependencies]
sinomo-actions.workspace = true
base64.workspace = true
blake3.workspace = true
candle-core = { version = "0.11.0", optional = true }
metrics.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sinomo-agent = { path = "../sinomo-agent" }
sinomo-client = { path = "../sinomo-client" }
sinomo-audio = { path = "../sinomo-audio" }
sinomo-dfs-fuse = { path = "../sinomo-dfs-fuse", optional = true, default-features = false }
sinomo-lm = { path = "../sinomo-lm", features = ["test-cases", "cli"] }
sinomo-memory = { path = "../sinomo-memory" }
sinomo-models = { path = "../sinomo-models", optional = true }
sinomo-pytorch = { path = "../sinomo-pytorch" }
sinomo-product-profile = { path = "../sinomo-product-profile" }
sinomo-video = { path = "../sinomo-video" }
time.workspace = true
tracing.workspace = true
sinomo-runtime = { path = "../sinomo-runtime" }
tokenizers = { version = "0.23.1", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "signal"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
libc = "0.2.186"
notify.workspace = true
fs2.workspace = true

[dev-dependencies]
image.workspace = true
sinomo-runtime = { workspace = true, features = ["cluster-test-support", "network-test-support", "dfs-test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
wat = "1.253.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = ["Gaming_Input", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }
