[package]
name = "sinomo-cli"
version.workspace = true
description = "Shared Sinomo command-line handlers"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "application"

[dependencies]
base64 = "0.22"
candle-core = "0.10.2"
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sinomo-agent = { path = "../sinomo-agent" }
sinomo-evolution = { path = "../sinomo-evolution" }
sinomo-lm = { path = "../sinomo-lm" }
sinomo-models = { path = "../sinomo-models" }
sinomo-pytorch = { path = "../sinomo-pytorch" }
time.workspace = true
sinomo-runtime = { path = "../sinomo-runtime" }
tokenizers = "0.22.2"
