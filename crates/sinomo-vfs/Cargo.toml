[package]
name = "sinomo-vfs"
version.workspace = true
description = "Rooted virtual filesystem facade for local, SIFS, daemon, and test storage"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["src/**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sinomo-core = { path = "../sinomo-core" }
sinomo-daemon = { path = "../sinomo-daemon", default-features = false }
sinomo-dfs = { path = "../sinomo-dfs" }
thiserror.workspace = true

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
