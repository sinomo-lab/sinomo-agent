[package]
name = "sinomo-models"
version.workspace = true
description = "Rust-native model runtimes for Sinomo"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
safetensors = "0.8.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# A voice pack is a bare `torch.save(tensor)`, which Candle's state-dict loader skips, so the
# archive is opened directly. This is the same version Candle itself already links.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
