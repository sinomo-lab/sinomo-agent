[package]
name = "sinomo-observe"
version.workspace = true
description = "Sinomo operational observation module"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[features]
default = []
cpu-profiler = ["dep:pprof"]

[dependencies]
fs2.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
sinomo-cli-registry = { path = "../sinomo-cli-registry" }
sinomo-api = { path = "../sinomo-api" }
sinomo-core = { path = "../sinomo-core" }
sinomo-dfs = { path = "../sinomo-dfs" }
sinomo-module = { path = "../sinomo-module" }
sysinfo.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
pprof = { workspace = true, optional = true }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
