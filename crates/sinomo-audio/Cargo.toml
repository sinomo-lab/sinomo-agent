[package]
name = "sinomo-audio"
version.workspace = true
description = "Sinomo audio perception event producer skeleton"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[features]
default = []
native-devices = ["sinomo-runtime/native-devices"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sinomo-gateway = { path = "../sinomo-gateway" }
sinomo-runtime = { path = "../sinomo-runtime" }
thiserror.workspace = true
