[package]
name = "sinomo-sandbox-wasix-api"
version.workspace = true
description = "Stable native-dylib ABI and SOBJ envelopes for the Sinomo WASIX sandbox engine"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
serde.workspace = true
sinomo-module-api = { path = "../sinomo-module-api" }
sinomo-module = { path = "../sinomo-module" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-sandbox = { path = "../sinomo-sandbox" }
thiserror.workspace = true
