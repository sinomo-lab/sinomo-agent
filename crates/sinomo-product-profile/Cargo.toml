[package]
name = "sinomo-product-profile"
version.workspace = true
description = "Shared Sinomo product component composition profiles"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[features]
default = ["native-workers"]
# Native build queues and host-filesystem projections are desktop/server
# capabilities. Mobile embedded products omit both at compile time.
native-workers = []

[dependencies]
sinomo-runtime = { path = "../sinomo-runtime" }
