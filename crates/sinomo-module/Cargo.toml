[package]
name = "sinomo-module"
version.workspace = true
description = "Sinomo module registry, routing, loader state, and native module host glue"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "wit/**"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
base64 = "0.22"
blake3.workspace = true
libloading = "0.8"
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
sinomo-cli-registry = { path = "../sinomo-cli-registry" }
sinomo-core = { path = "../sinomo-core" }
sinomo-events = { path = "../sinomo-events" }
sinomo-local = { path = "../sinomo-local" }
sinomo-module-api = { path = "../sinomo-module-api" }
sinomo-node = { path = "../sinomo-node" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-storage = { path = "../sinomo-storage" }

[dev-dependencies]
