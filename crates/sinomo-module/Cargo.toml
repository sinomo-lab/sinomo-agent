[package]
name = "sinomo-module"
version.workspace = true
description = "Sinomo module registry, routing, loader state, and native module host glue"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "wit/**"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
sinomo-api.workspace = true
arc-swap.workspace = true
base64.workspace = true
blake3.workspace = true
fs2.workspace = true
libloading = "0.9.0"
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sinomo-cli-registry = { path = "../sinomo-cli-registry" }
sinomo-config = { path = "../sinomo-config" }
sinomo-core = { path = "../sinomo-core" }
sinomo-device = { path = "../sinomo-device" }
sinomo-module-api = { path = "../sinomo-module-api" }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }

[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true
