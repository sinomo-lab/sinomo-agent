[package]
name = "sinomo-device"
version.workspace = true
description = "Sinomo device profiles, permissions, capabilities, and node-local resource conditions"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[features]
default = []
native-devices = ["dep:cpal", "dep:nokhwa", "dep:v4l"]

[dependencies]
cpal = { workspace = true, optional = true }
serde.workspace = true
sinomo-core = { path = "../sinomo-core" }
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "UI_Input_Preview_Injection", "Gaming_Input", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
nokhwa = { workspace = true, features = ["decoding", "input-msmf"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { workspace = true, features = ["decoding", "input-avfoundation"], optional = true }

[dev-dependencies]
serde_json.workspace = true
sinomo-testdir.workspace = true
