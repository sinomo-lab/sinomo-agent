[package]
name = "sinomo-device"
version.workspace = true
description = "Sinomo device profile, permission, and capability metadata"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[features]
default = []
native-devices = ["dep:cpal", "dep:image", "dep:nokhwa", "dep:v4l"]

[dependencies]
cpal = { workspace = true, optional = true }
serde.workspace = true
sinomo-core = { path = "../sinomo-core" }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
image = { workspace = true, features = ["jpeg"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { workspace = true, features = ["decoding", "input-msmf"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { workspace = true, features = ["decoding", "input-avfoundation"], optional = true }

[dev-dependencies]
serde_json.workspace = true
