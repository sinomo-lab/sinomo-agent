[package]
name = "sinomo-agent"
version.workspace = true
description = "Sinomo bounded interactive controller skeleton"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r2"

[dependencies]
base64.workspace = true
blake3.workspace = true
notify.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { workspace = true }
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
sinomo-lm = { path = "../sinomo-lm" }
sinomo-memory = { path = "../sinomo-memory" }
sinomo-product-profile = { path = "../sinomo-product-profile" }
sinomo-runtime = { path = "../sinomo-runtime" }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
