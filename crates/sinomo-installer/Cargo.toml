[package]
name = "sinomo-installer"
version.workspace = true
description = "Sinomo local runtime installation and boot-entry orchestration"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "**/*.ps1", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
sinomo-api = { path = "../sinomo-api" }
sinomo-core = { path = "../sinomo-core" }
sinomo-daemon = { path = "../sinomo-daemon" }
sinomo-rollout = { path = "../sinomo-rollout" }
sinomo-build = { path = "../sinomo-build" }
sinomo-module = { path = "../sinomo-module" }
serde.workspace = true
serde_json.workspace = true
fs2.workspace = true
blake3.workspace = true
sysinfo.workspace = true
tar.workspace = true

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
