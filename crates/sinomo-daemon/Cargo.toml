[package]
name = "sinomo-daemon"
version.workspace = true
description = "Sinomo daemon control protocol, status, locking, and local client utilities"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[features]
default = ["sandbox"]
# Enable sandbox execution through the native-module host loader. The heavy
# WASIX engine is loaded from an active native-dylib module, not linked here.
sandbox = ["dep:sinomo-sandbox-wasix-host"]

[dependencies]
base64 = "0.22"
blake3.workspace = true
fs2.workspace = true
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sinomo-core = { path = "../sinomo-core" }
sinomo-config = { path = "../sinomo-config" }
sinomo-dfs = { path = "../sinomo-dfs" }
sinomo-events = { path = "../sinomo-events" }
sinomo-kv = { path = "../sinomo-kv" }
sinomo-local = { path = "../sinomo-local" }
sinomo-module = { path = "../sinomo-module" }
sinomo-network = { path = "../sinomo-network" }
sinomo-node = { path = "../sinomo-node" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-registry = { path = "../sinomo-registry" }
sinomo-rollout = { path = "../sinomo-rollout" }
sinomo-sandbox = { path = "../sinomo-sandbox" }
sinomo-sandbox-wasix-host = { path = "../sinomo-sandbox-wasix-host", optional = true }
sinomo-service = { path = "../sinomo-service" }
sinomo-storage = { path = "../sinomo-storage" }
thiserror.workspace = true
time.workspace = true
tokio = { version = "1.44", features = ["rt-multi-thread"] }

[dev-dependencies]
