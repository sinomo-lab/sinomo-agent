[package]
name = "sinomo-daemon"
version.workspace = true
description = "Sinomo daemon control protocol, status, locking, and local client utilities"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md"]

[package.metadata.sinomo]
ring = "r1"

[features]
default = []
# Enable daemon-managed sandbox lifecycle recovery and its focused tests.
# Command execution uses direct-SIFS WASIX or the live DFS/FUSE simple runner.
sandbox = []

[dependencies]
base64.workspace = true
blake3.workspace = true
fs2.workspace = true
metrics.workspace = true
netwatcher.workspace = true
ring = "0.17.14"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sinomo-api = { path = "../sinomo-api" }
sinomo-build = { path = "../sinomo-build" }
sinomo-core = { path = "../sinomo-core" }
sinomo-config = { path = "../sinomo-config" }
sinomo-dfs = { path = "../sinomo-dfs" }
sinomo-module = { path = "../sinomo-module" }
sinomo-module-api = { path = "../sinomo-module-api" }
sinomo-remote-management = { path = "../sinomo-remote-management" }
sinomo-observe = { path = "../sinomo-observe", features = ["cpu-profiler"] }
sinomo-registry = { path = "../sinomo-registry" }
sinomo-rollout = { path = "../sinomo-rollout" }
sinomo-sandbox = { path = "../sinomo-sandbox" }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing.workspace = true
sysinfo.workspace = true

[dev-dependencies]
sinomo-core = { path = "../sinomo-core", features = ["cluster-test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
