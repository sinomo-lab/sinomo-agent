[package]
name = "sinomo-network"
version.workspace = true
description = "In-process Sinomo peer registry and event routing skeleton"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r0"

[features]
# Exposes crate internals for sibling-crate integration tests.
test-support = ["dep:sinomo-kv"]
default = []
# TODO(stage-C-followup): remove this feature (and the `iroh` dep) once the
# daemon's built-in iroh proxy loop, sinomo-cli's direct-dial tests, and the
# sinomo-cluster proxy tests are migrated to the modules/network/iroh dylib.
# The extraction landed in stage C; registry-aware dispatch already prefers a
# registered module over this built-in path.
iroh-transport = ["dep:iroh"]

[dependencies]
arc-swap.workspace = true
base64.workspace = true
blake3.workspace = true
fs2.workspace = true
ring = "0.17"
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
metrics.workspace = true
tracing.workspace = true
iroh = { version = "0.98.2", optional = true }
local-ip-address.workspace = true
tokio.workspace = true
tower-layer = "0.3"
tower-service = "0.3"
sinomo-base = { path = "../sinomo-base" }
sinomo-events = { path = "../sinomo-events" }
sinomo-kv = { path = "../sinomo-kv", optional = true }
sinomo-local = { path = "../sinomo-local" }
sinomo-node = { path = "../sinomo-node" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-storage = { path = "../sinomo-storage" }

[dev-dependencies]
sinomo-kv = { path = "../sinomo-kv", features = ["test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
