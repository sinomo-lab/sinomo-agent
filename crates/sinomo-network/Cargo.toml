[package]
name = "sinomo-network"
version.workspace = true
description = "Sinomo direct links, connectivity, routed streams, and stream-native object RPC"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r0"

[features]
# Exposes crate internals for sibling-crate integration tests.
test-support = ["dep:sinomo-kv"]
default = []

[dependencies]
arc-swap.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
fs2.workspace = true
futures-util.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
metrics.workspace = true
tracing.workspace = true
local-ip-address.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-layer = "0.3.3"
tower-service = "0.3.3"
sinomo-base = { path = "../sinomo-base" }
sinomo-events = { path = "../sinomo-events" }
sinomo-kv = { path = "../sinomo-kv", optional = true }
sinomo-local = { path = "../sinomo-local" }
sinomo-node = { path = "../sinomo-node" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-storage = { path = "../sinomo-storage" }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
sinomo-kv = { path = "../sinomo-kv", features = ["test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
tokio = { workspace = true, features = ["test-util"] }
