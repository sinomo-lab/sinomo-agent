[package]
name = "sinomo-network"
version.workspace = true
description = "In-process Sinomo peer registry and event routing skeleton"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[features]
default = []
iroh-transport = ["dep:iroh", "dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
iroh = { version = "0.98.2", optional = true }
tokio = { version = "1.44", features = ["io-util", "net", "rt-multi-thread", "time"], optional = true }
sinomo-core = { path = "../sinomo-core" }
sinomo-events = { path = "../sinomo-events" }
sinomo-kv = { path = "../sinomo-kv" }
sinomo-local = { path = "../sinomo-local" }
sinomo-node = { path = "../sinomo-node" }
