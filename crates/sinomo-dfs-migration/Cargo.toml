[package]
name = "sinomo-dfs-migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Incremental conversion of retained DFS storage into the current native schema"

[package.metadata.sinomo]
ring = "r1"

[dependencies]
sinomo-dfs = { workspace = true, features = ["storage-conversion"] }
sinomo-core.workspace = true
sinomo-module.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
blake3.workspace = true
fs2.workspace = true
time.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
same-file.workspace = true

[dev-dependencies]
sinomo-dfs = { workspace = true, features = ["test-support"] }
sinomo-testdir.workspace = true
