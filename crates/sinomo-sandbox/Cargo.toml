[package]
name = "sinomo-sandbox"
version.workspace = true
description = "Sinomo SIFS-backed agent sandbox contracts (types, paths, policy, capabilities)"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "toolchains/**"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
blake3.workspace = true
getrandom = "0.2"
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
time.workspace = true
sinomo-core = { path = "../sinomo-core" }
sinomo-dfs = { path = "../sinomo-dfs" }
sinomo-events = { path = "../sinomo-events" }
sinomo-kv = { path = "../sinomo-kv" }
sinomo-module = { path = "../sinomo-module" }
sinomo-network = { path = "../sinomo-network" }
sinomo-node = { path = "../sinomo-node" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-storage = { path = "../sinomo-storage" }
