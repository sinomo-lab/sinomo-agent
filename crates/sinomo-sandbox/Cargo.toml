[package]
name = "sinomo-sandbox"
version.workspace = true
description = "Sinomo SIFS-backed agent sandbox contracts"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "toolchains/**"]

[package.metadata.sinomo]
ring = "r1"

[features]
default = ["wasix-runtime"]
wasix-runtime = [
    "dep:tokio",
    "dep:virtual-fs",
    "dep:virtual-mio",
    "dep:wasmer",
    "dep:wasmer-types",
    "dep:wasmer-wasix",
    "dep:wasmparser",
    "dep:webc",
]

[dependencies]
blake3.workspace = true
getrandom = "0.2"
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
time.workspace = true
sinomo-core = { path = "../sinomo-core" }
sinomo-dfs = { path = "../sinomo-dfs" }
sinomo-events = { path = "../sinomo-events" }
sinomo-kv = { path = "../sinomo-kv" }
sinomo-module = { path = "../sinomo-module" }
sinomo-network = { path = "../sinomo-network" }
sinomo-node = { path = "../sinomo-node" }
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-storage = { path = "../sinomo-storage" }
wasmtime = { version = "41.0.4", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "41.0.4", default-features = false, features = ["p1"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "time"], optional = true }
virtual-fs = { version = "0.700.0-alpha.2", default-features = false, optional = true }
virtual-mio = { version = "0.700.0-alpha.2", default-features = false, optional = true }
wasmer = { version = "=7.0.0-alpha.2", default-features = false, features = ["sys-default", "cranelift", "experimental-async"], optional = true }
wasmer-types = { version = "=7.0.0-alpha.2", default-features = false, optional = true }
wasmer-wasix = { version = "0.700.0-alpha.2", default-features = false, features = ["sys-minimal", "host-fs", "host-vnet"], optional = true }
wasmparser = { version = "0.244.0", default-features = false, optional = true }
webc = { version = "10.0.1", default-features = false, optional = true }

[dev-dependencies]
wat = "1.248.0"
