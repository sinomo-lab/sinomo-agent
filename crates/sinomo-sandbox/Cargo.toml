[package]
name = "sinomo-sandbox"
version.workspace = true
description = "Sinomo sandbox contracts, policy, storage, and external-executor client"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml", "toolchains/**"]

[package.metadata.sinomo]
ring = "r1"

[features]
# Mirrored by the native WASIX execution module: its `wasix-runtime` feature
# enables this one so capability/policy checks in this crate reflect whether the
# WASIX backend is actually linked. This marker adds no dependencies of its own;
# the sandbox crate carries no provider implementation or Wasm engine code.
wasix-runtime = []

[dependencies]
blake3.workspace = true
fs2.workspace = true
getrandom = "0.4.3"
libc = "0.2.186"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
time.workspace = true
sinomo-cli-registry = { path = "../sinomo-cli-registry" }
sinomo-api = { path = "../sinomo-api" }
sinomo-core = { path = "../sinomo-core" }
sinomo-config = { path = "../sinomo-config" }
sinomo-dfs = { path = "../sinomo-dfs" }
sinomo-module = { path = "../sinomo-module" }
sinomo-module-api = { path = "../sinomo-module-api" }
sinomo-registry = { path = "../sinomo-registry" }
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
tokio.workspace = true
wat = "1.253.0"
