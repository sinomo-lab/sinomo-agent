[package]
name = "sinomo-runtime"
version.workspace = true
description = "Explicit R0/R1 runtime boundary facade for Sinomo service crates"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.sinomo]
ring = "r0-r1-boundary"

[features]
# Enable sandbox execution through the native-module host loader. This does not
# link the build-heavy WASIX engine.
sandbox = ["sinomo-daemon/sandbox"]

[dependencies]
sinomo-api = { path = "../sinomo-api" }
sinomo-core = { path = "../sinomo-core" }
sinomo-daemon = { path = "../sinomo-daemon" }
sinomo-device = { path = "../sinomo-device" }
sinomo-dfs = { path = "../sinomo-dfs" }
sinomo-eval = { path = "../sinomo-eval" }
sinomo-events = { path = "../sinomo-events" }
sinomo-local = { path = "../sinomo-local" }
sinomo-kv = { path = "../sinomo-kv" }
sinomo-module = { path = "../sinomo-module" }
sinomo-module-api = { path = "../sinomo-module-api" }
sinomo-network = { path = "../sinomo-network", features = ["iroh-transport"] }
sinomo-node = { path = "../sinomo-node" }
sinomo-object = { path = "../sinomo-object" }
sinomo-policy = { path = "../sinomo-policy" }
sinomo-registry = { path = "../sinomo-registry" }
sinomo-rollout = { path = "../sinomo-rollout" }
sinomo-sandbox = { path = "../sinomo-sandbox" }
sinomo-sandbox-wasix-api = { path = "../sinomo-sandbox-wasix-api" }
sinomo-sandbox-wasix-host = { path = "../sinomo-sandbox-wasix-host" }
sinomo-service = { path = "../sinomo-service" }
sinomo-storage = { path = "../sinomo-storage" }
sinomo-supervision = { path = "../sinomo-supervision" }
