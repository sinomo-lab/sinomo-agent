[package]
name = "sinomo-runtime"
version.workspace = true
description = "Explicit R1 runtime boundary facade for Sinomo service crates"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.sinomo]
ring = "r1-boundary"

[features]
default = []
# Enable sandbox execution through the native-module host loader. This does not
# link the build-heavy WASIX engine.
sandbox = ["sinomo-daemon/sandbox"]
native-devices = ["sinomo-device/native-devices"]
# Forwards the cluster test-support surface to application-crate tests.
cluster-test-support = ["sinomo-core/cluster-test-support"]

[dependencies]
sinomo-api = { path = "../sinomo-api" }
sinomo-build = { path = "../sinomo-build" }
sinomo-cli-registry = { path = "../sinomo-cli-registry" }
sinomo-config = { path = "../sinomo-config" }
sinomo-core = { path = "../sinomo-core" }
sinomo-daemon = { path = "../sinomo-daemon", default-features = false }
sinomo-device = { path = "../sinomo-device" }
sinomo-dfs = { path = "../sinomo-dfs" }
sinomo-dfs-nfs = { path = "../sinomo-dfs-nfs" }
sinomo-eval = { path = "../sinomo-eval" }
sinomo-installer = { path = "../sinomo-installer" }
sinomo-module = { path = "../sinomo-module" }
sinomo-module-api = { path = "../sinomo-module-api" }
sinomo-observe = { path = "../sinomo-observe" }
sinomo-policy = { path = "../sinomo-policy" }
sinomo-registry = { path = "../sinomo-registry" }
sinomo-remote-management = { path = "../sinomo-remote-management" }
sinomo-rollout = { path = "../sinomo-rollout" }
sinomo-sandbox = { path = "../sinomo-sandbox" }
sinomo-sandbox-simple = { path = "../sinomo-sandbox-simple" }
sinomo-supervision = { path = "../sinomo-supervision" }
sinomo-test = { path = "../sinomo-test" }
sinomo-vfs = { path = "../sinomo-vfs" }
sinomo-vfs-sifs = { path = "../sinomo-vfs-sifs" }
