[package]
name = "sinomo-sandbox-simple"
version.workspace = true
description = "Simple native host-layout sandbox runtime for Sinomo"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
sinomo-core = { path = "../sinomo-core" }
sinomo-sandbox = { path = "../sinomo-sandbox" }
time.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
