[package]
name = "sinomo-sandbox-simple"
version.workspace = true
description = "Simple native host-layout sandbox runtime for Sinomo"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
libc = "0.2"
sinomo-node = { path = "../sinomo-node" }
sinomo-sandbox = { path = "../sinomo-sandbox" }
time.workspace = true

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
