[package]
name = "sinomo-rollout"
version.workspace = true
description = "Sinomo rollout advancement and rollback skeleton"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
time.workspace = true
sinomo-object = { path = "../sinomo-object", features = ["serde"] }
sinomo-core = { path = "../sinomo-core" }
sinomo-events = { path = "../sinomo-events" }
sinomo-module = { path = "../sinomo-module" }
sinomo-node = { path = "../sinomo-node" }
sinomo-registry = { path = "../sinomo-registry" }
sinomo-sandbox-wasix-api = { path = "../sinomo-sandbox-wasix-api" }
sinomo-storage = { path = "../sinomo-storage" }
