[package]
name = "sinomo-service"
version.workspace = true
description = "Host-agnostic Sinomo service seam: trait, context, and registry for object-RPC control-plane services"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
arc-swap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
sinomo-core = { path = "../sinomo-core" }
sinomo-kv = { path = "../sinomo-kv" }
sinomo-local = { path = "../sinomo-local" }
sinomo-network = { path = "../sinomo-network" }

[dev-dependencies]
serde.workspace = true
sinomo-testdir = { path = "../sinomo-testdir" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
