[package]
name = "sinomo-app-daemon"
version.workspace = true
description = "App-owned foreground host for the full Sinomo daemon product"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["src/**/*.rs", "build.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "application"

[dependencies]
sinomo-cli = { path = "../sinomo-cli" }
sinomo-runtime = { path = "../sinomo-runtime" }

[dev-dependencies]
sinomo-client = { path = "../sinomo-client" }
sinomo-testdir = { path = "../sinomo-testdir" }
