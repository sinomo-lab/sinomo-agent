[package]
name = "sinomo-app"
version = "0.1.0"
description = "Sinomo agent client — graphical desktop app (chat, SIFS files, settings)"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
include = ["**/*.rs", "**/*.sublime-syntax", "build.rs", "Cargo.toml", "assets/**/*", "java/**/*"]

[package.metadata.sinomo]
ring = "application"

[features]
default = ["desktop", "native-devices"]
gui = ["dep:sui", "dep:sui-lucide"]
desktop = [
    "gui",
    "dep:rfd",
    "dep:sui-webview",
    "dep:tiny_http",
    "dep:cap-std",
    "sui/desktop",
]
mobile = ["gui", "sui/mobile", "native-devices"]
native-devices = [
    "sinomo-audio/native-devices",
    "sinomo-video/native-devices",
]

[[bin]]
name = "sinomo-app"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
bytes.workspace = true
csv.workspace = true
half.workspace = true
npyz.workspace = true
parquet.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
zip.workspace = true
sysinfo.workspace = true
notify.workspace = true
fs2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
blake3 = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing", "serde", "serde-well-known"] }
tracing = { workspace = true }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
rfd = { workspace = true, optional = true }
two-face.workspace = true
syntect = { workspace = true }
similar.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff"] }
pulldown-cmark = { workspace = true, features = ["html"] }
percent-encoding.workspace = true

# Published SUI dependencies shared by desktop and Android.
sui = { workspace = true, optional = true, features = ["wgpu"] }
sui-lucide = { workspace = true, optional = true }

# Application/R2 service crates used directly (allowed by trust-ring rules).
sinomo-client = { path = "../sinomo-client" }
sinomo-audio = { path = "../sinomo-audio" }
sinomo-lm = { path = "../sinomo-lm" }
sinomo-video = { path = "../sinomo-video" }

# R0/R1 surface is reached only through the runtime facade (ring boundary).
sinomo-runtime = { path = "../sinomo-runtime", default-features = false, features = [
    "client",
    "native-devices",
    "module-client",
    "file-sync",
    "observe-client",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
rustls-platform-verifier.workspace = true
sinomo-agent = { path = "../sinomo-agent" }
sinomo-cli = { path = "../sinomo-cli", default-features = false }
sinomo-product-profile = { path = "../sinomo-product-profile", default-features = false }
sinomo-runtime = { path = "../sinomo-runtime", features = ["host", "native-devices"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
sui-webview = { workspace = true, optional = true }
mime_guess.workspace = true
getrandom.workspace = true
tiny_http = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
android-build = "0.1.4"

[dev-dependencies]
sinomo-agent = { path = "../sinomo-agent" }
sinomo-cli = { path = "../sinomo-cli", default-features = false, features = ["dfs-test-support"] }
sinomo-product-profile = { path = "../sinomo-product-profile", default-features = false }
sinomo-runtime = { path = "../sinomo-runtime", features = ["host", "native-devices", "dfs-test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
# Headless rendering harness for visual verification of the widget tree.
sui-testing.workspace = true
