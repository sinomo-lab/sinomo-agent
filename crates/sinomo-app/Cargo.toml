[package]
name = "sinomo-app"
version = "0.1.0"
description = "Sinomo agent client — graphical desktop app (chat, SIFS files, settings)"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
include = ["**/*.rs", "Cargo.toml", "assets/**/*"]

[package.metadata.sinomo]
ring = "application"

[features]
default = ["gui", "native-devices"]
gui = ["dep:sui"]
native-devices = [
    "sinomo-audio/native-devices",
    "sinomo-runtime/native-devices",
    "sinomo-video/native-devices",
]

[[bin]]
name = "sinomo-app"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing", "serde", "serde-well-known"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# Graphical toolkit (separate workspace, referenced by path). Keep this behind
# the app feature so daemon rollout builds can load the workspace without the
# sibling SUI checkout when `sinomo-app` is not being built.
sui = { path = "../../../sui/crates/sui", optional = true }

# Application/R2 service crates used directly (allowed by trust-ring rules).
sinomo-cli = { path = "../sinomo-cli" }
sinomo-agent = { path = "../sinomo-agent" }
sinomo-audio = { path = "../sinomo-audio" }
sinomo-evolution = { path = "../sinomo-evolution" }
sinomo-lm = { path = "../sinomo-lm" }
sinomo-video = { path = "../sinomo-video" }

# R0/R1 surface is reached only through the runtime facade (ring boundary).
sinomo-runtime = { path = "../sinomo-runtime" }

[dev-dependencies]
# Headless rendering harness for visual verification of the widget tree.
sui-testing = { path = "../../../sui/crates/sui-testing" }
