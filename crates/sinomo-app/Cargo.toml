[package]
name = "sinomo-app"
version = "0.1.0"
description = "Sinomo agent client — graphical desktop app (chat, SIFS files, settings)"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
include = ["**/*.rs", "build.rs", "Cargo.toml", "assets/**/*", "java/**/*"]

[package.metadata.sinomo]
ring = "application"

[features]
default = ["desktop", "native-devices"]
gui = ["dep:sui"]
desktop = [
    "gui",
    "dep:rfd",
    "sui/desktop",
    "sinomo-cli/sandbox",
    "sinomo-cli/dfs-fuse",
]
mobile = ["gui", "sui/mobile"]
native-devices = [
    "sinomo-audio/native-devices",
    "sinomo-runtime/native-devices",
    "sinomo-video/native-devices",
]

[[bin]]
name = "sinomo-app"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
blake3 = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing", "serde", "serde-well-known"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
rfd = { workspace = true, optional = true }
syntect = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }

# Graphical toolkit tracked from the public SUI main branch. Cargo.lock records
# the exact reviewed commit used by normal and `--locked` builds, while an
# intentional `cargo update` advances joint development to a newer main tip.
sui = { package = "sinomo-ui", git = "https://github.com/sinomo-lab/sui.git", branch = "main", optional = true, default-features = false, features = ["wgpu"] }

# Application/R2 service crates used directly (allowed by trust-ring rules).
sinomo-cli = { path = "../sinomo-cli", default-features = false }
sinomo-agent = { path = "../sinomo-agent" }
sinomo-audio = { path = "../sinomo-audio" }
sinomo-evolution = { path = "../sinomo-evolution" }
sinomo-lm = { path = "../sinomo-lm" }
sinomo-product-profile = { path = "../sinomo-product-profile" }
sinomo-video = { path = "../sinomo-video" }

# R0/R1 surface is reached only through the runtime facade (ring boundary).
sinomo-runtime = { path = "../sinomo-runtime" }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
netwatcher.workspace = true

[build-dependencies]
android-build = "0.1.4"

[dev-dependencies]
sinomo-testdir = { path = "../sinomo-testdir" }
# Headless rendering harness for visual verification of the widget tree.
sui-testing = { package = "sinomo-ui-testing", git = "https://github.com/sinomo-lab/sui.git", branch = "main" }
