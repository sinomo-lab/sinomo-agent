[package]
name = "sinomo-rollout-host"
version.workspace = true
description = "Daemon process host adapter for the Sinomo rollout component"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
include = ["src/**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[dependencies]
sinomo-cli-registry.workspace = true
fs2.workspace = true
serde_json.workspace = true
sinomo-api = { path = "../sinomo-api" }
sinomo-core = { path = "../sinomo-core" }
sinomo-config = { path = "../sinomo-config" }
sinomo-daemon = { path = "../sinomo-daemon", default-features = false }
sinomo-module = { path = "../sinomo-module" }
sinomo-rollout = { path = "../sinomo-rollout" }
tokio.workspace = true
tracing.workspace = true
time.workspace = true
thiserror.workspace = true

[dev-dependencies]
sinomo-dfs = { path = "../sinomo-dfs", features = ["test-support"] }
sinomo-testdir = { path = "../sinomo-testdir" }
