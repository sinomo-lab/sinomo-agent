image: rust:1.96.0-bookworm

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - build
  - validate

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target/ci"
  CARGO_TERM_COLOR: "always"
  SINOMO_RELEASE_TARGETS: >-
    x86_64-unknown-linux-gnu
    aarch64-unknown-linux-gnu
    x86_64-pc-windows-gnu

default:
  interruptible: true
  cache:
    key:
      files:
        - Cargo.lock
      prefix: cargo-rust-1.96
    paths:
      - .cache/cargo/registry/index/
      - .cache/cargo/registry/cache/
      - .cache/cargo/git/db/

build:documentation:
  stage: build
  image: python:3.12-slim
  cache: []
  script:
    - python3 -m unittest discover -s scripts/docs -p 'test_*.py'
    - python3 scripts/docs/check_links.py
    - python3 scripts/docs/check_links.py AGENTS.md .agents/skills skills
    - python3 scripts/docs/check_content.py
    - python3 -m unittest discover -s scripts/ci -p 'test_desktop_installer.py'

build:dfs-kv-boundary:
  stage: build
  timeout: 1h
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git build-essential pkg-config cmake clang python3 libssl-dev libudev-dev libasound2-dev
    - rustup toolchain install nightly-2026-08-20 --profile minimal --component rustc-dev --component llvm-tools-preview
    - cargo install cargo-dylint dylint-link --version 6.1.0 --locked
  script:
    - bash scripts/ci/check-dfs-kv-boundary.sh
  artifacts:
    when: always
    paths:
      - target/dfs-kv-boundary/
    expire_in: 3 days

build:cross-platform-cli:
  stage: build
  timeout: 2h
  before_script:
    - >-
      apt-get update
      && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      ca-certificates
      file
      gcc-aarch64-linux-gnu
      gcc-mingw-w64-x86-64-posix
      git
      libc6-dev-arm64-cross
      mingw-w64-x86-64-dev
      zip
    - rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu
  script:
    - ./scripts/ci/build-release-artifacts.sh
  artifacts:
    name: "sinomo-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 3 days

build:desktop-linux-x86_64:
  stage: build
  timeout: 2h
  variables:
    SINOMO_RELEASE_PROFILE: desktop
    SINOMO_RELEASE_TARGETS: x86_64-unknown-linux-gnu
    APPIMAGE_EXTRACT_AND_RUN: "1"
  before_script:
    - >-
      apt-get update
      && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      ca-certificates file git zip build-essential pkg-config cmake clang python3
      libssl-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      libx11-dev libxrandr-dev libxi-dev libxext-dev libxcursor-dev libxinerama-dev
      libvulkan-dev libv4l-dev libfuse2 patchelf squashfs-tools desktop-file-utils
      librsvg2-bin
    - cargo install cargo-packager --version 0.11.8 --locked --root target/packager-tool --target-dir target/packager-tool-build
  script:
    - ./scripts/ci/build-release-artifacts.sh
    - cargo test --locked -p sinomo-installer -p sinomo-setup -p sinomo-local
    - python3 scripts/ci/build-desktop-installer.py --target x86_64-unknown-linux-gnu --packager target/packager-tool/bin/cargo-packager
  artifacts:
    name: "sinomo-desktop-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
      - target/ci/installer-stage/x86_64-unknown-linux-gnu/headless-cli.tar.gz
    expire_in: 3 days

# A shell runner tagged windows must provide MSVC/Windows SDK, Rustup, Python >=3.11,
# CMake, LLVM and Git. No signing credentials or upstream binary updater are required.
build:desktop-windows-x86_64:
  stage: build
  tags: [windows]
  timeout: 3h
  variables:
    RUSTUP_TOOLCHAIN: "1.96.0"
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - rustup toolchain install 1.96.0 --profile minimal
    - 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - rustup target add x86_64-pc-windows-msvc
    - 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - cargo install cargo-packager --version 0.11.8 --locked --root target/packager-tool --target-dir target/packager-tool-build
    - 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
  script:
    - cargo test --locked -p sinomo-installer -p sinomo-setup -p sinomo-local
    - 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - python scripts/ci/build-desktop-installer.py --target x86_64-pc-windows-msvc --packager target/packager-tool/bin/cargo-packager.exe
    - 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
  artifacts:
    name: "sinomo-desktop-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/installers/
    expire_in: 3 days

validate:headless-container-install:
  stage: validate
  image: python:3.12-slim-bookworm
  needs:
    - job: build:cross-platform-cli
      artifacts: true
    - job: build:desktop-linux-x86_64
      artifacts: true
  cache: []
  script:
    - python3 scripts/ci/test-headless-install.py --archive $(find dist -maxdepth 1 -name 'sinomo-*-linux-x86_64.tar.gz' | head -n 1) --output target/headless-install
    - python3 scripts/ci/test-headless-install.py --archive target/ci/installer-stage/x86_64-unknown-linux-gnu/headless-cli.tar.gz --output target/headless-desktop-cli
  artifacts:
    when: always
    paths:
      - target/headless-install/
      - target/headless-desktop-cli/
    expire_in: 3 days
