# Sinomo production node.
#
# Runs ONE cluster node from the full image (docker/Dockerfile): the shadow
# supervisor as PID 1 supervising the main daemon, with the Rust toolchain and
# managed source repo baked in so self-rollout (`rollout apply` / `rollout
# cluster`) can build new binaries in-container. iroh stays ENABLED so roaming
# nodes reach the cluster through the relay when no direct route exists.
#
# Bootstrap the first node (seed):
#
#   docker compose up --build -d
#   docker compose exec sinomo sinomo cluster invite --ttl-seconds 86400 --output /shared/invite.json
#   docker compose cp sinomo:/shared/invite.json ./invite.json   # hand to the joining node
#
# Join an existing cluster from another host:
#
#   docker compose cp ./invite.json sinomo:/shared/invite.json
#   SINOMO_ROLE=joiner SINOMO_JOIN_INVITE=/shared/invite.json \
#     SINOMO_INTRODUCER=<seed-host>:21353 docker compose up -d
#
# Configuration (environment, all optional):
#   SINOMO_ROLE            seed | joiner                 (default: seed)
#   SINOMO_NODE_NAME       cluster node name             (default: sinomo)
#   SINOMO_CLUSTER_NAME    cluster name, seed only       (default: sinomo)
#   SINOMO_INTRODUCER      host:port to join through     (joiners)
#   SINOMO_JOIN_INVITE     invite file path in-container (joiners)
#   SINOMO_ADVERTISE_HOST  address advertised to peers   (default: node name)
#
# The development clusters live under docker/ and run the HOST-BUILT binary to
# avoid in-image builds:
#   docker/docker-compose.dev.yml          6-node segmented network test bed
#   docker/docker-compose.single-node.yml  single-node DFS / self-evolution smoke

services:
  sinomo:
    image: sinomo-node
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    hostname: ${SINOMO_NODE_NAME:-sinomo}
    environment:
      ROLE: ${SINOMO_ROLE:-seed}
      NODE_NAME: ${SINOMO_NODE_NAME:-sinomo}
      CLUSTER_NAME: ${SINOMO_CLUSTER_NAME:-sinomo}
      INTRODUCER: ${SINOMO_INTRODUCER:-}
      JOIN_INVITE: ${SINOMO_JOIN_INVITE:-}
      # Production keeps iroh enabled (relay-assisted reachability for roaming
      # peers); the dev cluster disables it on purpose.
      SINOMO_DISABLE_IROH: "0"
      # Bootstrap the default cluster-backed SIFS filesystem (metadata shards
      # published to cluster KV) so DFS works across nodes out of the box.
      SINOMO_ENABLE_DEFAULT_DISTRIBUTED_DFS: "1"
      SINOMO_DAEMON_ADVERTISE_HOST: ${SINOMO_ADVERTISE_HOST:-}
    ports:
      - "21353:21353" # main daemon
      - "21354:21354" # shadow supervisor
    volumes:
      - sinomo-data:/data
      - sinomo-shared:/shared

volumes:
  sinomo-data:
  sinomo-shared:
