# Deliberately separate from the Sinomo workspace. This fixture models an
# independently built module artifact and must never become a core dependency.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
sinomo-module-api = { path = "../../crates/sinomo-module-api" }
sinomo-observe-contract = { path = "../../crates/sinomo-observe-contract" }
