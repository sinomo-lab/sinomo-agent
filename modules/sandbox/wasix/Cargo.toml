[package]
name = "sinomo-sandbox-wasix-module"
version.workspace = true
description = "Trusted native-dylib WASIX execution module for sinomo-sandbox"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[package.metadata.sinomo.native-dylib]
module-id = "module.sandbox.wasix"
interface-version = "sinomo.sandbox.wasix.v1"
cache-key = "module/sandbox/wasix"
source = "rollout:modules/sandbox/wasix"
features = ["sinomo-sandbox-wasix-module/wasix-runtime"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasix-runtime = [
    "sinomo-sandbox/wasix-runtime",
    "dep:tokio",
    "dep:virtual-fs",
    "dep:virtual-mio",
    "dep:wasmtime",
    "dep:wasmer",
    "dep:wasmer-types",
    "dep:wasmer-vm",
    "dep:wasmer-wasix",
    "dep:wasmparser",
    "dep:webc",
]

[dependencies]
sinomo-sandbox = { path = "../../../crates/sinomo-sandbox" }
blake3.workspace = true
getrandom = "0.2"
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
time.workspace = true
sinomo-core = { path = "../../../crates/sinomo-core" }
sinomo-dfs = { path = "../../../crates/sinomo-dfs" }
sinomo-events = { path = "../../../crates/sinomo-events" }
sinomo-kv = { path = "../../../crates/sinomo-kv" }
sinomo-module = { path = "../../../crates/sinomo-module" }
sinomo-network = { path = "../../../crates/sinomo-network" }
sinomo-node = { path = "../../../crates/sinomo-node" }
sinomo-object = { path = "../../../crates/sinomo-object", features = ["serde"] }
sinomo-sandbox-wasix-api = { path = "../../../crates/sinomo-sandbox-wasix-api" }
sinomo-storage = { path = "../../../crates/sinomo-storage" }
wasmtime = { version = "41.0.4", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"], optional = true }
tokio = { version = "1.44", features = ["rt-multi-thread", "time"], optional = true }
virtual-fs = { version = "0.700.0-alpha.2", default-features = false, features = ["host-fs"], optional = true }
virtual-mio = { version = "0.700.0-alpha.2", default-features = false, optional = true }
wasmer = { version = "=7.0.0-alpha.2", default-features = false, features = ["sys-default", "cranelift", "experimental-async"], optional = true }
wasmer-types = { version = "=7.0.0-alpha.2", default-features = false, optional = true }
wasmer-vm = { version = "=7.0.0-alpha.2", default-features = false, optional = true }
wasmer-wasix = { version = "0.700.0-alpha.2", default-features = false, features = ["sys-minimal", "host-fs", "host-vnet"], optional = true }
wasmparser = { version = "0.244.0", default-features = false, optional = true }
webc = { version = "10.0.1", default-features = false, optional = true }

[dev-dependencies]
wat = "1.248.0"
