[package]
name = "sinomo-sandbox-wasix-module"
version.workspace = true
description = "Trusted native-dylib WASIX execution module for sinomo-sandbox"
authors = ["Infinity_X <Infinity_X@sinomo.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.sinomo]
ring = "r1"

[package.metadata.sinomo.native-dylib]
module-id = "module.sandbox.wasix"
interface-version = "1.0.0"
cache-key = "module/sandbox/wasix"
source = "rollout:modules/sandbox/wasix"
features = ["sinomo-sandbox-wasix-module/wasix-runtime"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasix-runtime = [
    "sinomo-sandbox/wasix-runtime",
    "dep:tokio",
    "dep:virtual-fs",
    "dep:virtual-mio",
    "dep:wasmtime",
    "dep:wasmer",
    "dep:wasmer-types",
    "dep:wasmer-vm",
    "dep:wasmer-wasix",
    "dep:wasmparser",
    "dep:webc",
]

[dependencies]
sinomo-sandbox = { path = "../../../crates/sinomo-sandbox" }
blake3.workspace = true
getrandom = "0.4.3"
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
time.workspace = true
sinomo-core = { path = "../../../crates/sinomo-core" }
sinomo-dfs = { path = "../../../crates/sinomo-dfs" }
sinomo-module = { path = "../../../crates/sinomo-module" }
sinomo-module-api = { path = "../../../crates/sinomo-module-api" }
wasmtime = { version = "46.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"], optional = true }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "time"], optional = true }
# These patched Wasmer/WASIX crates and the webc type passed into WasiRunner
# must be rebased as one cohort. virtual-mio 0.700.1 is source-compatible with
# that cohort and is intentionally allowed to advance independently.
virtual-fs = { version = "=0.700.0-alpha.2", default-features = false, features = ["host-fs"], optional = true }
virtual-mio = { version = "0.700.1", default-features = false, optional = true }
wasmer = { version = "=7.0.0-alpha.2", default-features = false, features = ["sys-default", "cranelift", "experimental-async"], optional = true }
wasmer-types = { version = "=7.0.0-alpha.2", default-features = false, optional = true }
wasmer-vm = { version = "=7.0.0-alpha.2", default-features = false, optional = true }
wasmer-wasix = { version = "=0.700.0-alpha.2", default-features = false, features = ["sys-minimal", "host-fs", "host-vnet"], optional = true }
wasmparser = { version = "0.253.0", default-features = false, optional = true }
webc = { version = "=10.0.1", default-features = false, optional = true }

[dev-dependencies]
sinomo-runtime = { workspace = true, features = ["dfs-test-support"] }
sinomo-testdir = { path = "../../../crates/sinomo-testdir" }
wat = "1.253.0"
