[package]
name = "sinomo-remote-management-module"
version.workspace = true
description = "Trusted native dylib module for remote machine management"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.sinomo]
ring = "r1"

[package.metadata.sinomo.native-dylib]
module-id = "module.remote-management"
interface-version = "sinomo.remote-management.v1"
cache-key = "module/remote/management"
source = "rollout:modules/remote/management"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
blake3.workspace = true
serde.workspace = true
sysinfo.workspace = true
time.workspace = true
sinomo-core = { path = "../../../crates/sinomo-core" }
sinomo-module-api = { path = "../../../crates/sinomo-module-api" }
sinomo-remote-management = { path = "../../../crates/sinomo-remote-management" }

[dev-dependencies]
sinomo-testdir = { path = "../../../crates/sinomo-testdir" }
